name: Cross Compile

on:
  push:
    branches:
      - feat/engineering-infrastructure
    paths:
      - '.cargo/**'
      - '.github/workflows/cross-compile.yml'
      - 'crates/**'
      - 'src/**'
      - 'build.rs'
      - 'Cargo.lock'
      - 'Cargo.toml'
      - 'Cross.toml'
      - 'rust-toolchain.toml'
  workflow_dispatch:
    inputs:
      target:
        description: '编译目标'
        required: true
        type: choice
        options:
          - all
          - armv7-unknown-linux-uclibceabihf
          - armv7-unknown-linux-gnueabihf
          - aarch64-unknown-linux-gnu
          - x86_64-unknown-linux-gnu
        default: all
      version:
        description: '版本标签 (例如: v1.0.0)'
        required: false
        default: build-validation
      publish_release:
        description: '全部构建成功后创建 GitHub Release'
        required: true
        type: boolean
        default: false

permissions:
  contents: read
  packages: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON((github.event_name == 'push' || inputs.target == 'all') && '["armv7-unknown-linux-uclibceabihf","armv7-unknown-linux-gnueabihf","aarch64-unknown-linux-gnu","x86_64-unknown-linux-gnu"]' || format('["{0}"]', inputs.target)) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install stable Rust
        if: ${{ matrix.target != 'armv7-unknown-linux-uclibceabihf' }}
        uses: dtolnay/rust-toolchain@1.90.0
        with:
          targets: ${{ matrix.target }}

      - name: Install nightly Rust for uClibc
        if: ${{ matrix.target == 'armv7-unknown-linux-uclibceabihf' }}
        uses: dtolnay/rust-toolchain@nightly-2025-09-14
        with:
          components: rust-src

      - name: Install cross
        uses: taiki-e/install-action@v2
        with:
          tool: cross@0.2.5

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build
        env:
          RUSTUP_TOOLCHAIN: ${{ matrix.target == 'armv7-unknown-linux-uclibceabihf' && 'nightly-2025-09-14' || '1.90.0' }}
        run: cross build --release --locked --target "${{ matrix.target }}"

      - name: Verify binary architecture and linkage
        run: |
          binary="target/${{ matrix.target }}/release/xiaozhi_linux_rs"
          file "${binary}"
          readelf -d "${binary}" | tee dynamic-section.txt
          grep -q 'libasound.so' dynamic-section.txt
          ! grep -q 'libopus.so' dynamic-section.txt
          ! grep -q 'libspeexdsp.so' dynamic-section.txt
          if [ "${{ matrix.target }}" = 'armv7-unknown-linux-uclibceabihf' ]; then
            grep -q 'libc.so.0' dynamic-section.txt
            readelf -Ws "${binary}" | grep -q 'getauxval'
          fi

      - name: Name artifact
        id: artifact
        shell: bash
        run: |
          case '${{ matrix.target }}' in
            armv7-unknown-linux-uclibceabihf) echo 'name=armv7-uclibceabihf' >> "${GITHUB_OUTPUT}" ;;
            armv7-unknown-linux-gnueabihf) echo 'name=armv7-gnueabihf' >> "${GITHUB_OUTPUT}" ;;
            aarch64-unknown-linux-gnu) echo 'name=aarch64-gnu' >> "${GITHUB_OUTPUT}" ;;
            x86_64-unknown-linux-gnu) echo 'name=x86_64-gnu' >> "${GITHUB_OUTPUT}" ;;
          esac

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: xiaozhi_linux_rs-${{ steps.artifact.outputs.name }}
          path: target/${{ matrix.target }}/release/xiaozhi_linux_rs
          if-no-files-found: error

  release:
    if: ${{ inputs.publish_release }}
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download selected artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Prepare release files
        run: |
          mkdir release
          for artifact in artifacts/xiaozhi_linux_rs-*; do
            suffix="${artifact##*/xiaozhi_linux_rs-}"
            install -m 0755 "${artifact}/xiaozhi_linux_rs" "release/xiaozhi_linux_rs-${suffix}"
          done
          test "$(find release -type f | wc -l)" -gt 0

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.version }}
          name: ${{ inputs.version }}
          body_path: RELEASE_NOTES.md
          generate_release_notes: false
          files: release/*
